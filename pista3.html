<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pista 3</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff0f3; color: #4a4a4a; text-align: center; padding: 20px; }
        .card { background: #ffffff; border-radius: 20px; padding: 30px; margin: 20px auto; max-width: 500px; box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4); border: 1px solid #ffccd5; }
        h1 { color: #ff4d6d; font-size: 1.6em; }
        .dica { background: #ffe5ec; color: #800f2f; padding: 20px; border-radius: 15px; font-weight: 600; margin-top: 20px; font-size: 1.1em; line-height: 1.5; border: 1px dashed #ffb3c1; }
        .btn-play { background: #ff758f; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-bottom: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <audio id="musica" loop autoplay>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <button class="btn-play" onclick="document.getElementById('musica').play()">🎵 Ligar Música</button>
        <h1>🛋️ Direto do Sofá!</h1>
        
        <div class="dica">
            🧩 <strong>PISTA 3:</strong><br><br>
            "Atenção: essa pista teve um 'pequeno atraso no processamento'! Para encontrar a próxima ordem da missão, dê uma olhada ali perto da impressora ou do computador..."
        </div>
    </div>
</body>
</html>
