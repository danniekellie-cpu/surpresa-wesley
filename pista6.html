<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Gran Finale!</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 25px; margin-top: 20px; border: 2px solid #ff4757; }
        h1 { color: #ff4757; font-size: 1.8em; }
        .pegadinha { background: #ff6b81; color: #fff; padding: 15px; border-radius: 10px; font-size: 1.1em; margin-bottom: 20px; font-weight: bold; }
        .final { background: #2ed573; color: #000; padding: 20px; border-radius: 10px; font-weight: bold; font-size: 1.1em; line-height: 1.5; }
        button { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 20px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <audio id="musica" loop autoplay>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <button onclick="document.getElementById('musica').play()">🎵 Ligar Música</button>
        
        <div class="pegadinha">
            😜 Ops... Achar que estava fácil assim dentro do guarda-roupa? Ainda não!
        </div>
        
        <h1>🏆 SEU VERDADEIRO TESOURO!</h1>
        
        <div class="final">
            "O meu maior presente é ter você de volta, mas preparei uma surpresa especial de reencontro. Olhe bem no alto do guarda-roupa e pegue o seu tesouro!" 🎁✨
        </div>
    </div>
</body>
</html>
