<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pista 5</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 25px; margin-top: 20px; }
        h1 { color: #a55eea; }
        .dica { background: #fed330; color: #000; padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 20px; font-size: 1.1em; }
        button { background: #a55eea; color: white; border: none; padding: 12px 20px; border-radius: 20px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <audio id="musica" loop autoplay>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <button onclick="document.getElementById('musica').play()">🎵 Ligar Música</button>
        <h1>🪞 Olhou no Espelho?</h1>
        
        <div class="dica">
            🧩 <strong>PISTA 5:</strong><br><br>
            "O caminho agora te leva para onde suas roupas ficam bem guardadas! Abra as portas e procure bem entre as gavetas ou cabides..."
        </div>
    </div>
</body>
</html>
