<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja Bem-Vindo de Volta!</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff0f3; color: #4a4a4a; text-align: center; padding: 20px; }
        .card { background: #ffffff; border-radius: 20px; padding: 30px; margin: 20px auto; max-width: 500px; box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4); border: 1px solid #ffccd5; }
        h1 { color: #ff4d6d; font-size: 1.8em; margin-bottom: 15px; }
        p { font-size: 1.1em; line-height: 1.6; color: #595959; }
        .destaque { font-size: 1.2em; font-weight: bold; color: #c9184a; margin: 20px 0; }
        .btn-play { background: #ff758f; color: white; border: none; padding: 10px 20px; border-radius: 20px; margin-bottom: 20px; font-weight: bold; cursor: pointer; }
        .btn-proximo { display: inline-block; background-color: #ff4d6d; color: white; text-decoration: none; padding: 14px 28px; border-radius: 25px; font-weight: bold; font-size: 1.1em; margin-top: 15px; box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3); }
    </style>
</head>
<body>
    <audio id="musica" loop autoplay>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <button class="btn-play" onclick="document.getElementById('musica').play()">🎵 Ligar Música</button>
        
        <h1>💖 Seja bem-vindo de volta!</h1>
        
        <p class="destaque">"Viajar é bom, mas ter você nos meus braços é muito melhor!"</p>
        
        <p>Para chegar até a sua surpresa, escaneie os QR Codes escondidos pela casa a cada nova dica encontrada.</p>
        
        <a href="pista1.html" class="btn-proximo">🔍 Começar o Caça ao Tesouro</a>
    </div>
</body>
</html>
