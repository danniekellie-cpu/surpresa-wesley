<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pista 4</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 25px; margin-top: 20px; }
        h1 { color: #1e90ff; }
        .dica { background: #ff7f50; color: #fff; padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 20px; font-size: 1.1em; }
        button { background: #1e90ff; color: white; border: none; padding: 12px 20px; border-radius: 20px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <audio id="musica" loop autoplay>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <button onclick="document.getElementById('musica').play()">🎵 Ligar Música</button>
        <h1>🖨️ Impressão Concluída!</h1>
        
        <div class="dica">
            🧩 <strong>PISTA 4:</strong><br><br>
            "Hora de tirar a poeira da viagem e se preparar para ficar cheiroso! No lugar de tomar banho, procure pelo seu próprio reflexo..."
        </div>
    </div>
</body>
</html>
